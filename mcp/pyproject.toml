[project]
name = "ahnlich-mcp"
version = "0.1.0"
description = "MCP server for the Ahnlich vector database"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
dependencies = [
    "mcp>=1.27,<2",
    "ahnlich-client-py==0.4.0",
    "betterproto>=2.0.0b7,<3",
]

[project.scripts]
ahnlich-mcp = "ahnlich_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

agent-test = [
    "openai-agents",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ahnlich_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires running Ahnlich services",
]