x-mcp: &mcp
  image: "${AHNLICH_MCP_IMAGE:-ghcr.io/deven96/ahnlich-mcp}:${AHNLICH_MCP_VERSION:-latest}"
  stdin_open: true
  tty: false
  init: true
  restart: "no"

services:
  ahnlich_db:
    image: "ghcr.io/deven96/ahnlich-db:${AHNLICH_DB_VERSION:-0.3.2}"
    command: >
      "ahnlich-db run --host 0.0.0.0
      --enable-persistence
      --persist-location /root/.ahnlich/data/db.dat
      --persistence-interval 30000"
    ports:
      - "1369:1369"
    volumes:
      - "./data/db:/root/.ahnlich/data"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "echo 'PING' | ahnlich-cli ahnlich --agent db --host 127.0.0.1 --port 1369 --no-interactive",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  ahnlich_ai:
    image: "ghcr.io/deven96/ahnlich-ai:${AHNLICH_AI_VERSION:-0.4.1}"
    command: >
      "ahnlich-ai run --db-host ahnlich_db --host 0.0.0.0
      --supported-models all-minilm-l6-v2
      --enable-persistence
      --persist-location /root/.ahnlich/data/ai.dat
      --persistence-interval 30000"
    ports:
      - "1370:1370"
    volumes:
      - "./data/ai_models:/root/.ahnlich/models"
      - "./data/ai:/root/.ahnlich/data"
    depends_on:
      ahnlich_db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "echo 'PING' | ahnlich-cli ahnlich --agent ai --host 127.0.0.1 --port 1370 --no-interactive",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  mcp-db:
    <<: *mcp
    profiles: ["db"]
    command: ["--profile", "db"]
    environment:
      AHNLICH_DB_HOST: ahnlich_db
      AHNLICH_DB_PORT: "1369"
      AHNLICH_MCP_READ_ONLY: "${AHNLICH_MCP_READ_ONLY:-0}"
    depends_on:
      ahnlich_db:
        condition: service_healthy

  mcp-ai:
    <<: *mcp
    profiles: ["ai"]
    command: ["--profile", "ai"]
    environment:
      AHNLICH_AI_HOST: ahnlich_ai
      AHNLICH_AI_PORT: "1370"
      AHNLICH_AI_MODEL: "${AHNLICH_AI_MODEL:-all-minilm-l6-v2}"
      AHNLICH_MCP_READ_ONLY: "${AHNLICH_MCP_READ_ONLY:-0}"
    depends_on:
      ahnlich_ai:
        condition: service_healthy

  mcp-external:
    <<: *mcp
    profiles: ["external"]
    command: ["--profile", "${AHNLICH_PROFILE:-ai}"]
    environment:
      AHNLICH_PROFILE: "${AHNLICH_PROFILE:-ai}"
      AHNLICH_DB_HOST: "${AHNLICH_DB_HOST:-host.docker.internal}"
      AHNLICH_DB_PORT: "${AHNLICH_DB_PORT:-1369}"
      AHNLICH_AI_HOST: "${AHNLICH_AI_HOST:-host.docker.internal}"
      AHNLICH_AI_PORT: "${AHNLICH_AI_PORT:-1370}"
      AHNLICH_AI_MODEL: "${AHNLICH_AI_MODEL:-all-minilm-l6-v2}"
      AHNLICH_MCP_READ_ONLY: "${AHNLICH_MCP_READ_ONLY:-0}"
    extra_hosts:
      - "host.docker.internal:host-gateway"