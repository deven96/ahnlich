name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.11 integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.31"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install project
        run: uv sync --locked --dev

      - name: Validate MCP server imports
        run: >
          uv run python -c
          'import asyncio;
          from ahnlich_mcp.server import mcp;
          tools = asyncio.run(mcp.list_tools());
          print([tool.name for tool in tools]);
          assert tools, "No MCP tools were registered"'

      - name: Prepare Ahnlich data directories
        run: mkdir -p data/db data/ai data/ai_models

      - name: Restore Ahnlich model cache
        uses: actions/cache@v6
        with:
          path: data/ai_models
          key: ahnlich-models-${{ runner.os }}-all-minilm-l6-v2-v1

      - name: Start Ahnlich
        run: docker compose up -d --wait --wait-timeout 600

      - name: Show container status
        run: docker compose ps

      - name: Run tests
        run: uv run pytest tests/ -v

      - name: Show Ahnlich logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop Ahnlich
        if: always()
        run: docker compose down --remove-orphans