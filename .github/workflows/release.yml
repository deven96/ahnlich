name: Ahnlich AI and DB Release

on:
  release:
    types: [published]


permissions:
  contents: write

jobs:

    prebuild_preparation:
      name: Get Binary Type
      runs-on: ubuntu-latest
      outputs:
        bin_name: ${{ steps.get_binary_type.outputs.BIN_NAME }}
        bin_suffix: ${{ steps.get_binary_type.outputs.BIN_SUFFIX }}
        rust_version: ${{ steps.rust_version.outputs.RUST_VERSION }}
        ort_version: ${{ steps.ort_version.outputs.ORT_VERSION }}
      steps:
          - name: "Checkout"
            uses: actions/checkout@v4

          - name: "Get Rust version from toolchain file"
            id: rust_version
            working-directory: ./ahnlich
            run: |
                VERSION=$(grep -E '^channel\s*=' rust-toolchain.toml | sed 's/.*"\(.*\)".*/\1/')
                echo "RUST_VERSION=$VERSION" >> $GITHUB_OUTPUT

          - name: "Set ORT version"
            id: ort_version
            run: |
                echo "ORT_VERSION=1.23.2" >> $GITHUB_OUTPUT

          - name: "Get Binary Type"
            id: get_binary_type
            run: |
                cd ${{github.workspace}}
                echo ${{ github.event.release.tag_name }}
                value=$(echo "${{ github.event.release.tag_name }}" | cut -d'/' -f2)
                echo "$value"
                echo "BIN_SUFFIX=${value}" >> $GITHUB_OUTPUT
                echo "BIN_NAME=ahnlich-${value}" >> $GITHUB_OUTPUT
            

    build_binaries_and_publish:
        needs: prebuild_preparation
        strategy:
          matrix:
            include:
              - target: x86_64-unknown-linux-gnu
                runner: ubuntu-22.04
              - target: aarch64-unknown-linux-gnu
                runner: ubuntu-22.04-arm
              - target: x86_64-apple-darwin
                runner: macos-latest
              - target: aarch64-apple-darwin
                runner: macos-latest

        name: Build ${{ matrix.target }} Binaries
        runs-on:  ${{ matrix.runner }}
        outputs:
          bin_name: ${{ needs.prebuild_preparation.outputs.bin_name }}
        steps:
            - name: "Checkout"
              uses: actions/checkout@v4

            - name: Get Cargo toolchain
              uses: actions-rs/toolchain@v1
              with:
                toolchain: ${{ needs.prebuild_preparation.outputs.rust_version }}

            - name: Build Linux Release for ${{ needs.prebuild_preparation.outputs.bin_name }}
              working-directory: ./ahnlich
              run: |
                rm types/build.rs replication/build.rs
                rustup target add ${{matrix.target}}
                export MATRIX_TARGET=${{matrix.target}}
                echo ${{ needs.prebuild_preparation.outputs.bin_name }}
                if [[ ${{ needs.prebuild_preparation.outputs.bin_name }} == "ahnlich-ai" ]] && [[ $MATRIX_TARGET == *darwin ]]; then
                  echo "running with coreml.."  
                  cargo build --features coreml --release --target ${{matrix.target}} --bin ${{ needs.prebuild_preparation.outputs.bin_name }}
                else
                    echo "running without features" 
                    cargo build --release --target ${{matrix.target}} --bin ${{ needs.prebuild_preparation.outputs.bin_name }}
                fi
                tar -cvzf ${{matrix.target}}-${{ needs.prebuild_preparation.outputs.bin_name }}.tar.gz -C target/${{matrix.target}}/release ${{ needs.prebuild_preparation.outputs.bin_name }}
                gh release upload ${{github.event.release.tag_name}} ${{matrix.target}}-${{ needs.prebuild_preparation.outputs.bin_name }}.tar.gz

              env:
                GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
              shell: bash

    build_wasm_and_publish:
        needs: prebuild_preparation
        name: Build WASM package
        runs-on: ubuntu-latest
        if: ${{needs.prebuild_preparation.outputs.bin_name == 'ahnlich-db'}}
        steps:
          - name: "Checkout"
            uses: actions/checkout@v4

          - name: Get Cargo toolchain
            uses: actions-rs/toolchain@v1
            with:
              toolchain: ${{ needs.prebuild_preparation.outputs.rust_version }}
              target: wasm32-unknown-unknown

          - name: Install wasm-pack
            run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

          - name: Build WASM package
            working-directory: ./ahnlich/wasm-db
            run: |
              wasm-pack build --target web --out-dir pkg
              tar -cvzf ahnlich-wasm-db.tar.gz pkg/

          - name: Upload WASM package to release
            working-directory: ./ahnlich/wasm-db
            run: gh release upload ${{github.event.release.tag_name}} ahnlich-wasm-db.tar.gz
            env:
              GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

    push_to_registries_cuda:
        needs: prebuild_preparation
        name: Push Docker image (CUDA) to multiple registries
        runs-on: ubuntu-latest
        if: ${{needs.prebuild_preparation.outputs.bin_name != 'ahnlich-cli'}}
        permissions:
          packages: write
          contents: read
          attestations: write
          id-token: write
        steps:
          - name: Check out the repo
            uses: actions/checkout@v4
          
          - name: Cache Docker images
            uses: ScribeMD/docker-cache@0.5.0
            with:
              key: ${{ runner.os }}-cargo-${{ hashFiles('ahnlich/Cargo.lock') }}

          - name: Set Port Based on Bin Name
            id: set_port
            run: |
              if [ "${{ needs.prebuild_preparation.outputs.bin_name }}" == "ahnlich-db" ]; then
                echo "DEFAULT_PORT=1369" >> $GITHUB_ENV
                echo "DESCRIPTION=Ahnlich DB" >> $GITHUB_ENV
              else
                echo "DEFAULT_PORT=1370" >> $GITHUB_ENV
                echo "DESCRIPTION=Ahnlich AI" >> $GITHUB_ENV
              fi

          - name: Extract version number from tag
            id: extract_version
            run: |
              # Extract version from release tag (format: bin/<suffix>/<version>)
              VERSION=$(echo "${{ github.event.release.tag_name }}" | cut -d'/' -f3)
              echo $VERSION
              echo "BIN_VERSION=$VERSION" >> $GITHUB_ENV

          - name: Log in to the Container registry
            uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
            with:
              registry: ghcr.io
              username: ${{ github.repository_owner }}
              password: ${{ secrets.GH_GCR_TOKEN }}

          
          - name: Extract metadata (tags, labels) for Docker
            id: meta
            uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
            with:
              images: ghcr.io/${{ github.repository_owner }}/${{needs.prebuild_preparation.outputs.bin_name}}
              tags: |
                type=raw,value=${{env.BIN_VERSION}}
                type=raw,value=latest
              labels: |
                org.opencontainers.image.description=${{ env.DESCRIPTION }}

          - name: Build and push Docker images
            id: push
            uses: docker/build-push-action@5cd11c3a4ced054e52742c5fd54dca954e0edd85
            with:
              context: ./ahnlich
              push: true
              tags: ${{ steps.meta.outputs.tags }}
              labels: ${{ steps.meta.outputs.labels }}
              build-args: |
                AHNLICH_BIN=${{ needs.prebuild_preparation.outputs.bin_name}}
                DEFAULT_PORT=${{env.DEFAULT_PORT}}
                RUST_VERSION=${{ needs.prebuild_preparation.outputs.rust_version }}
                ORT_VER=${{ needs.prebuild_preparation.outputs.ort_version }}

          - name: Generate artifact attestation
            uses: actions/attest-build-provenance@v1
            with:
              subject-name: ghcr.io/${{ github.repository_owner }}/${{needs.prebuild_preparation.outputs.bin_name}}
              subject-digest: ${{ steps.push.outputs.digest }}
              push-to-registry: true

    push_to_registries_migraphx:
        needs: prebuild_preparation
        name: Push Docker image (MIGraphX) to multiple registries
        runs-on: ubuntu-latest
        if: ${{needs.prebuild_preparation.outputs.bin_name == 'ahnlich-ai'}}
        permissions:
          packages: write
          contents: read
          attestations: write
          id-token: write
        steps:
          - name: Check out the repo
            uses: actions/checkout@v4
          
          - name: Cache Docker images
            uses: ScribeMD/docker-cache@0.5.0
            with:
              key: ${{ runner.os }}-cargo-${{ hashFiles('ahnlich/Cargo.lock') }}-migraphx

          - name: Set Port Based on Bin Name
            id: set_port
            run: |
              echo "DEFAULT_PORT=1370" >> $GITHUB_ENV
              echo "DESCRIPTION=Ahnlich AI (MIGraphX)" >> $GITHUB_ENV

          - name: Extract version number from tag
            id: extract_version
            run: |
              # Extract version from release tag (format: bin/<suffix>/<version>)
              VERSION=$(echo "${{ github.event.release.tag_name }}" | cut -d'/' -f3)
              echo $VERSION
              echo "BIN_VERSION=$VERSION" >> $GITHUB_ENV

          - name: Log in to the Container registry
            uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
            with:
              registry: ghcr.io
              username: ${{ github.repository_owner }}
              password: ${{ secrets.GH_GCR_TOKEN }}

          
          - name: Extract metadata (tags, labels) for Docker
            id: meta
            uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
            with:
              images: ghcr.io/${{ github.repository_owner }}/${{needs.prebuild_preparation.outputs.bin_name}}
              tags: |
                type=raw,value=${{env.BIN_VERSION}}-migraphx
                type=raw,value=latest-migraphx
              labels: |
                org.opencontainers.image.description=${{ env.DESCRIPTION }}

          - name: Build and push Docker images
            id: push
            uses: docker/build-push-action@5cd11c3a4ced054e52742c5fd54dca954e0edd85
            with:
              context: ./ahnlich
              file: ./ahnlich/Dockerfile.migraphx
              push: true
              tags: ${{ steps.meta.outputs.tags }}
              labels: ${{ steps.meta.outputs.labels }}
              build-args: |
                AHNLICH_BIN=${{ needs.prebuild_preparation.outputs.bin_name}}
                DEFAULT_PORT=${{env.DEFAULT_PORT}}
                RUST_VERSION=${{ needs.prebuild_preparation.outputs.rust_version }}
                ORT_VER=${{ needs.prebuild_preparation.outputs.ort_version }}

          - name: Generate artifact attestation
            uses: actions/attest-build-provenance@v1
            with:
              subject-name: ghcr.io/${{ github.repository_owner }}/${{needs.prebuild_preparation.outputs.bin_name}}
              subject-digest: ${{ steps.push.outputs.digest }}
              push-to-registry: true
