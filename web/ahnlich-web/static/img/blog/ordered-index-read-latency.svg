<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">BTreeSet page-read speedup over SkipSet</title>
  <desc id="desc">At one million IDs and the middle cursor, BTreeSet is 6.2 times faster for a page of 100 IDs and 10.2 times faster for a page of 1,000 IDs.</desc>
  <rect width="800" height="420" fill="#f5f5f5"/>

  <text x="48" y="48" font-family="Inter, system-ui, sans-serif" font-size="25" font-weight="700" fill="#0a0a0a">BTreeSet returned pages faster</text>
  <text x="48" y="74" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#737373">1 million IDs · middle cursor</text>

  <line x1="104" y1="324" x2="752" y2="324" stroke="#737373" stroke-width="1"/>
  <line x1="104" y1="224" x2="752" y2="224" stroke="#cccccc" stroke-width="1"/>
  <line x1="104" y1="124" x2="752" y2="124" stroke="#cccccc" stroke-width="1"/>

  <text x="72" y="329" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#737373">0×</text>
  <text x="72" y="229" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#737373">5×</text>
  <text x="64" y="129" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#737373">10×</text>

  <rect x="214" y="201" width="120" height="123" fill="#cc9200"/>
  <rect x="518" y="120" width="120" height="204" fill="#cc9200"/>

  <text x="274" y="187" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#0a0a0a">6.2×</text>
  <text x="578" y="106" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#0a0a0a">10.2×</text>

  <text x="274" y="352" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#0a0a0a">100 IDs</text>
  <text x="578" y="352" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#0a0a0a">1,000 IDs</text>
  <text x="428" y="385" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#737373">Page size</text>
</svg>
