[package]
name = "ahnlich_similarity"
version = "0.0.1"
authors = ["Diretnan Domnan <diretnandomnan@gmail.com>"]
categories = ["concurrency", "data-structures"]
keywords = ["ahnlich", "array", "lock-free", "multidimensional", "matrix", "kdtree"]
edition = "2024"
license-file = "LICENSE"
homepage = "https://github.com/deven96/ahnlich"
repository = "https://github.com/deven96/ahnlich"
description = "Lock free non-linear vector similarity algorithms"

[badges]
maintenance = { status = "actively-developed" }
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
arc-swap.workspace = true
parking_lot.workspace = true
crossbeam = "0.8.4"
papaya.workspace = true
seize.workspace = true
serde = { workspace = true, features = ["derive"], optional = true }
tracing.workspace = true
rand.workspace = true
itertools.workspace = true
ahash.workspace = true
pulp.workspace = true
smallvec.workspace = true
ahnlich_types = { version = "0.4.1", path = "../types", default-features = false }

[features]
default = ["serde"]
serde = ["dep:serde"]
bench-experiments = []


[dev-dependencies]
rand.workspace = true
pretty_assertions.workspace = true
serde_json.workspace = true
rstest = "0.26.1"
criterion = "0.4"
tikv-jemallocator.workspace = true
tikv-jemalloc-ctl.workspace = true



[[bench]]
name = "hnsw_bench"
harness = false

[[bench]]
name = "hnsw_collector_sharing"
path = "benches/experiments/hnsw_collector_sharing.rs"
harness = false
required-features = ["bench-experiments"]

[[bench]]
name = "hnsw_collector_memory"
path = "benches/memory/hnsw_collector_memory.rs"
harness = false
required-features = ["bench-experiments"]

[[bench]]
name = "hnsw_counter_shards_memory"
path = "benches/memory/hnsw_counter_shards_memory.rs"
harness = false
required-features = ["bench-experiments"]

[[bench]]
name = "hnsw_compact_adjacency_graph"
path = "benches/experiments/hnsw_compact_adjacency_graph.rs"
harness = false
required-features = ["bench-experiments"]

[[bench]]
name = "hnsw_compact_adjacency_graph_memory"
path = "benches/memory/hnsw_compact_adjacency_graph_memory.rs"
harness = false
required-features = ["bench-experiments"]
